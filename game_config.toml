# 这里只包含最常用的配置，其他配置项需要在 gamedata/default_config.toml 中修改，在这里直接添加【无效】
#---------------------------------------------------
# 以下三项（用户可调）可在顶层直接覆盖（注释掉即恢复 default_config.toml 默认值）：
#   mcts_turn_bonus = <整数>   # 蒙特卡洛每回合期望得分加成
#   pt_favor_rate   = <浮点>   # PT 偏好评分倍率
#   race_grades     = [整数1, 整数2, ...]   # 比赛等级表（72 项，回合 0-71）
# 温泉选择优先顺序，根据育成需求调整
# 温泉ID: 
# 第一年: (1)疾驰 (2)坚忍 (3)明晰
# 第二年: (4)骏闪 (5)刚足 (6)健壮 (7)天翔
# 第三年: (8)秘汤 - 分身效果 (9)传说 - 比赛+80%（⭐特殊：第三年9月强制选择）
#---------------------------------------------------
[onsen_order]
year1 = [1, 3, 2]
year2 = [7, 5, 4, 2]
year3 = [8, 9, 4, 2, 6]

[config_override]
#---------------------------------------------------
# 剧本因子额外属性 [速度, 耐力, 力量, 根性, 智力, 技能点]
# 例如：默认设置下，每次继承除了蓝因子126属性以外，会额外得到10速度，20根/智, 40pt
#---------------------------------------------------
extra_count = [10, 0, 0, 20, 20, 40]

#---------------------------------------------------
# 温泉选择是否允许蒙特卡洛自由发挥。安卓马建议设为false减少世界线，狄杜斯凹分建议开启
#---------------------------------------------------
mcts_selected_onsen = true

#---------------------------------------------------
# 日志级别: "debug" (完整显示) | "off" (全部关闭) | "info" (简要显示) | "trace" (详细显示) 
#---------------------------------------------------
log_level = "info"

#---------------------------------------------------
# 线程数，建议设置为=CPU核心数
# 特定处理器(如Intel 14900k）如果出现崩溃/蓝屏情况，需要设置线程数为8，以强制使用性能核心运行
#---------------------------------------------------
num_threads = 24

#---------------------------------------------------
# 蒙特卡洛配置
#---------------------------------------------------
[mcts]
# 每个动作的最大搜索次数（默认 12288；计算太慢可选 8192/4096，安卓马世界线较多，建议>16384）
search_n = 12288

#---------------------------------------------------
# 激进度上限：越大越重视胡局; 激进度会随回合数增加而降低，避免在后期冒险赌训练失败
# 0 - 完全平均
# 0-1 - 轻微忽视差局面（如训练失败）
# 1-2 - 忽视差局面，只统计好局面
# 2-4 - 只考虑很好的局面
# >4 - 只考虑最好的局面
#---------------------------------------------------
radical_factor_max = 1.4
