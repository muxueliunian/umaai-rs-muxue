[package]
name = "analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
# analyzer 仅消费面向用户的结构化输出，不需要规则层诊断日志。
# 不用 workspace = true 是因为 cargo 不允许子 crate 覆盖 workspace 依赖的 default-features；
# 直接 path 引入并显式声明 default-features = false 是 cargo 1.97 下的合规做法。
umasim = { path = "../umasim", default-features = false }
umaai.workspace = true
anyhow.workspace = true
bincode.workspace = true
chrono.workspace = true
clap.workspace = true
colored.workspace = true
comfy-table.workspace = true
enum-iterator.workspace = true
env_logger.workspace = true
fs-err.workspace = true
hashbrown.workspace = true
indicatif.workspace = true
inquire.workspace = true
log.workspace = true
notify.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
flexi_logger.workspace = true
# ONNX 推理
tract-onnx.workspace = true
ndarray.workspace = true

