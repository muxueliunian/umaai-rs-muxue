[package]
name = "umasim"
version = "0.2.3"
edition = "2024"

[[bin]]
name = "umasim"
path = "src/main.rs"
# umasim binary 是终端交互入口，需要 cli
required-features = ["cli"]

[[bin]]
name = "ramen_manual"
path = "src/bin/ramen_manual.rs"
# ramen_manual 走 inquire 终端交互 + diag 日志
required-features = ["cli", "diag"]

# Feature 设计（详见 changelog「依赖边界整理 + feature 拆分」）：
# - core：serde / rand / rayon / toml / chrono / log 等平台无关依赖，无条件编译
# - cli：终端交互与 UI（inquire / comfy-table / flexi_logger / indicatif / clap / tokio 等）
# - diag：diag! 宏的 cfg 开关，关闭时宏体编译期消除（零运行时开销）
# - no-color：启用 colored/no-color（编译期无色）。colored 无条件加载，
#   非 Windows 纯 std 实现，Android / 嵌入式交叉编译无风险
# - onnx：神经网络评估器（暂不使用，预留给 Phase 5+ 模型推理）
[features]
default = ["cli", "diag"]
diag = []
cli = [
    "dep:inquire",
    "dep:comfy-table",
    "dep:flexi_logger",
    "dep:env_logger",
    "dep:indicatif",
    "dep:text-to-ascii-art",
    "dep:clap",
    "dep:tokio",
]
# 编译期无色（colored 自带 no-color feature），独立于 cli 可单独使用
no-color = ["colored/no-color"]
onnx = ["dep:tract-onnx"]

[dependencies]
# ---- 核心依赖（无条件编译）----
anyhow.workspace = true
bincode.workspace = true
chrono.workspace = true
enum-iterator.workspace = true
fs-err.workspace = true
hashbrown.workspace = true
log.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
int-enum = "1.2.0"
parse-display = "0.11.0"
# colored 无条件加载（消除 cli 关闭时的双版本 cfg gate 重复代码；非 Windows 纯 std，见顶部）
colored.workspace = true
# 基准工具依赖（平台无关，无条件编译；lexopt 零依赖跨平台 CLI 解析，csv 数据序列化）
csv.workspace = true
lexopt.workspace = true

# ---- cli 依赖（仅 feature = "cli" 时编译）----
inquire = { workspace = true, optional = true }
comfy-table = { workspace = true, optional = true }
flexi_logger = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
text-to-ascii-art = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# ---- onnx 依赖（仅 feature = "onnx" 时编译；tract-onnx 0.22 自带 tract_ndarray）----
tract-onnx = { workspace = true, optional = true }
indexmap.workspace = true
