[package]
name = "umasim"
version = "0.2.3"
edition = "2024"

[[bin]]
name = "umasim"
path = "src/main.rs"

[[bin]]
name = "ramen_manual"
path = "src/bin/ramen_manual.rs"
required-features = ["diag"]

# [[bin]]
# name = "generate_training_data"
# path = "src/bin/generate_training_data.rs"

# [[bin]]
# name = "generate_mean_filtered_data"
# path = "src/bin/generate_mean_filtered_data.rs"

# diag feature 控制 output::diag! 宏的编译期可用性：
# - default = ["diag"]        本 crate 默认开（含 ramen_manual 等需看规则日志的 binary）
# - diag = []                  仅为一个 cfg 开关，无运行时依赖
#
# 关闭方式：依赖方写 `umasim = { path = "../umasim", default-features = false }`，编译
# 时 `diag!` 宏的整个调用体被 `#[cfg(feature = "diag")]` 消除，零运行时开销。
# 设计依据：.trae/documents/log_refactor_plan.md §3.2 / §6
[features]
default = ["diag"]
diag = []

[dependencies]
anyhow.workspace = true
bincode.workspace = true
chrono.workspace = true
clap.workspace = true
colored.workspace = true
comfy-table.workspace = true
enum-iterator.workspace = true
env_logger.workspace = true
fs-err.workspace = true
hashbrown.workspace = true
indicatif.workspace = true
inquire.workspace = true
log.workspace = true
notify.workspace = true
rand.workspace = true
rand_distr.workspace = true
#ratatui.workspace = true
rayon.workspace = true
#salvo.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
flexi_logger.workspace = true
# ONNX 推理
tract-onnx.workspace = true
ndarray.workspace = true
int-enum = "1.2.0"
parse-display = "0.11.0"

