[package]
name = "umaai"
version = "0.2.6"
edition = "2024"
build = "build.rs"

# winscribe 仅在 Windows 目标下作为构建依赖（编译 .ico 资源）
[target.'cfg(windows)'.build-dependencies]
winscribe = "0.1.3"

# windows crate 仅为 Windows 专用的 API（GetCurrentThreadStackLimits）服务，
# 且其依赖链（windows-future 等）在 Linux 上不兼容，故限定目标平台
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32", "Win32_System", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[dependencies]
# AI 助手 binary：不需要规则层诊断日志，关掉 `diag` feature 以避免无谓的开销与日志噪音。
# 不用 workspace = true 是因为 cargo 不允许子 crate 覆盖 workspace 依赖的 default-features；
# 直接 path 引入并显式声明 default-features = false 是 cargo 1.97 下的合规做法。
umasim = { path = "../umasim", default-features = false }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
colored.workspace = true
comfy-table.workspace = true
enum-iterator.workspace = true
env_logger.workspace = true
fs-err.workspace = true
hashbrown.workspace = true
indicatif.workspace = true
inquire.workspace = true
log.workspace = true
notify.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon.workspace = true
serde.workspace = true
ratatui.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
text-to-ascii-art.workspace = true
flexi_logger.workspace = true
os_str_bytes = "7.1.1"
dunce = "1.0.5"
