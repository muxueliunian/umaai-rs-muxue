# 基准测试配置（bench_base 专用）
#
# 独立于游戏配置 game_config.toml：本文件固定批量模拟与基线输出参数，
# 不参与游戏运行时配置。字段含义：
#
#   uma / cards          马娘与卡组（默认与 default_config.toml 的 simulation 段一致）
#   blue_count / extra_count  继承因子（InheritInfo）
#   runs                 批量局数
#   seed                 基础种子（第 i 局 = seed + i）
#   out_dir              输出目录（相对 workspace 根）
#   decision_log         是否落盘决策日志（rollout 海量场景默认关闭）
#
# CLI 参数可覆盖同名字段：--runs N --seed S --log（强制开启）--out DIR

uma = 102601
cards = [302424, 302894, 303044, 302924, 303024, 303054]
blue_count = [12, 0, 0, 0, 6]
extra_count = [10, 0, 0, 20, 20, 40]
runs = 20
seed = 42
out_dir = "logs"
decision_log = false