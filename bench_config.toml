# 基准测试配置（bench_base 专用）
#
# 独立于游戏配置 game_config.toml：本文件固定批量模拟与基线输出参数，
# 不参与游戏运行时配置。字段含义：
#
#   uma / cards          马娘与卡组（默认与 default_config.toml 的 simulation 段一致）
#   blue_count / extra_count  继承因子（InheritInfo）
#   runs                 批量局数
#   seed                 基础种子（第 i 局 = seed + i）
#   out_dir              输出目录（相对 workspace 根）
#   decision_log         是否落盘决策日志（rollout 海量场景默认关闭）
#
# CLI 参数可覆盖同名字段：--runs N --seed S --log（强制开启）--out DIR

uma = 101901
cards = [302424, 302894, 303044, 302924, 303024, 303054]
blue_count = [15, 0, 0, 0, 3]
extra_count = [10, 10, 20, 20, 20, 40]
runs = 20
seed = 61444
out_dir = "logs"
decision_log = false
# 训练员: "random"（基线）| "handwritten"（手写策略）
trainer = "random"

# 玩家 build 预置（玩家主流卡组构成，5 张普通卡 + 1 张友人卡）
# 由 bench::load_player_builds 读取；未配置时基准直接报错（必须显式配置）。
# key 为 build 名（TOML 保证非空唯一），value 为普通卡数量分布（合计 = 5、单类型 ≤ 3）。
# 说明：普通卡类型顺序 = [速, 耐, 力, 根, 智]；遍历保声明序。
[player_builds]
speed = [3, 1, 0, 0, 1]
stamina = [2, 2, 0, 0, 1]
power_wisdom = [0, 0, 2, 0, 3]
speed_wisdom = [2, 1, 0, 0, 2]
wisdom = [1, 1, 0, 0, 3]
sta0_wis2 = [1, 0, 1, 1, 2]
spd2_gut0 = [2, 1, 1, 0, 1]
