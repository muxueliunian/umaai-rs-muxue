[workspace]
members = ["crates/umasim", "crates/umaai"]
resolver = "2"

# ============================================================================
# ⚠⚠ 本地实验用改动 —— PR 发送前必须恢复为上游原值 ⚠⚠
#
# 上游原值（体积优化，明显是有意为之，勿在 PR 中带走本改动）：
#   opt-level = 'z'
#   debug = true
#   codegen-units = 16
#   lto = false
#
# 改成速度优先的理由：实测 30 配对局 28.0s -> 19.2s（1.46x），且两档
# 输出逐位相同（同 mean、同 30 个 delta、同 corr），不影响任何正确性验证。
# 项目此前所有耗时数字（含「教师数据 40-67h」估算）都是在体积优化档下
# 测的，与本档不可比。
# ============================================================================
[profile.release]
opt-level = 3
debug = false
codegen-units = 1
lto = "fat"

[workspace.dependencies]
umasim = { path = "crates/umasim" }
umaai = { path = "crates/umaai" }
anyhow = "1.0.100"
bincode = "1.3.3"
chrono = "0.4.42"
clap = { version = "4.5.50", features = ["derive"] }
colored = "3.0.0"
csv = "1.4.0"
lexopt = "0.3.2"
comfy-table = { version = "7.2.1", features = ["custom_styling"] }
enum-iterator = "2.3.0"
env_logger = "0.11.8"
fs-err = "3.1.3"
hashbrown = { version = "0.16.0", features = ["serde"] }
indicatif = "0.18.1"
log = "0.4.28"
notify = "8.2.0"
rand = { version = "0.9.2", features = ["serde", "std_rng"] }
rand_distr = { version = "0.5.1", features = ["serde"] }
rayon = "1.11.0"
#salvo = "0.84.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = { version = "0.9.8", features = ["preserve_order"] }
inquire = "0.9.1"
ratatui = { version = "0.29.0", features = ["all-widgets", "macros", "palette", "serde"] }
text-to-ascii-art = "0.1.10"
flexi_logger = "0.31.7"

# ONNX 推理
tract-onnx = "0.22.0"
ndarray = "0.17.1"

# 保序 map（bench player_builds 解析；已由 toml 间接依赖，仅提升为直接依赖）
indexmap = { version = "2.14.0", features = ["serde"] }

# Git 钩子分发（cargo-husky：构建时把 .cargo-husky/hooks/ 复制到 .git/hooks/）
# cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }
